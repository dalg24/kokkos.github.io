name: Register an application
description: Add your project to the list of applications leveraging Kokkos for performance portability.
title: "Register application: "
labels:
  - application-registry
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using Kokkos! This form adds your project to the
        [Applications](https://kokkos.org/community/applications/) page. A maintainer
        will open a pull request on your behalf from the information below.

        If you're comfortable with Git, you can also open a pull request directly
        using our [application PR template](https://github.com/kokkos/kokkos.github.io/compare?template=register-application.md)
        instead of filing this issue.

        Please provide at least one of the source repository, website, or
        documentation links below — they're shown as icons on your page.

        Feel free to attach a logo or screenshot to this issue (drag and drop an
        image into the text box below) — a maintainer will add it to your page.
  - type: input
    id: name
    attributes:
      label: Application name
      placeholder: "Albany"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area / domain
      description: What field or problem domain is this application used for?
      placeholder: "Climate, Molecular Dynamics, CFD, ..."
    validations:
      required: true
  - type: input
    id: institution
    attributes:
      label: Institution(s)
      description: Comma-separated if more than one institution collaborates on this project.
      placeholder: "Sandia National Laboratories, NREL"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source repository URL
      description: GitHub, GitLab, or Bitbucket URL. Shown as a source-code icon on your page.
      placeholder: "https://github.com/your-org/your-app"
    validations:
      required: false
  - type: input
    id: website
    attributes:
      label: Website URL (optional)
      description: Project homepage, if different from the source repository.
      placeholder: "https://your-project.org"
    validations:
      required: false
  - type: input
    id: documentation
    attributes:
      label: Documentation URL (optional)
      placeholder: "https://your-project.org/docs"
    validations:
      required: false
  - type: dropdown
    id: status
    attributes:
      label: Status
      description: How far along is the Kokkos port?
      options:
        - Evaluation
        - Development
        - Porting
        - Porting/Production
        - Production
        - Production and Development
        - Other (please specify in the notes field below)
    validations:
      required: true
  - type: input
    id: libraries
    attributes:
      label: Libraries used (optional)
      description: >
        Comma-separated list of libraries your application builds on top of —
        Kokkos ecosystem subprojects (kokkos-kernels, kokkos-fft, kokkos-comm,
        kokkos-mdspan, kokkos-tools, ...) and/or other third-party libraries
        (eigen, petsc, trilinos, ...). Shown as badges on your page.
      placeholder: "kokkos-kernels, kokkos-fft, petsc"
    validations:
      required: false
  - type: input
    id: contact-name
    attributes:
      label: Contact name(s)
      placeholder: "Jane Doe, John Smith"
    validations:
      required: true
  - type: input
    id: contact-email
    attributes:
      label: Contact email(s)
      placeholder: "jane.doe@example.org"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Description / notes (optional)
      description: >
        Anything else you'd like on your application's page — a longer description,
        links to docs or papers, or clarification if you picked "Other" above.
    validations:
      required: false
